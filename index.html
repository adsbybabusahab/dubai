<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <!-- मोबाइल स्क्रीन पर सही साइज दिखाने के लिए सबसे जरूरी टैग -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DUBAI JACKPOT KING</title>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.75)),
                        url('https://picsum.photos/800/1200') no-repeat center center/cover;
            padding: 20px 16px;
        }

        .container {
            width: 100%;
            max-width: 380px; /* मोबाइल पर सही चौड़ाई */
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Card Styling */
        .card {
            background: linear-gradient(180deg, #0f3818 0%, #051a0a 100%);
            border: 1px solid #1e5e29;
            border-radius: 20px;
            padding: 24px 18px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        /* Profile Image */
        .profile-container {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 15px;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(135deg, #ffd700, #ffae00, #00ff66);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            display: block;
        }

        /* Main Heading */
        .brand-name {
            color: #ffffff;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .subtitle {
            color: #d1d5db;
            font-size: 13px;
            line-height: 1.4;
            margin-bottom: 12px;
            font-weight: 400;
        }

        .active-members {
            color: #ffcc00;
            font-weight: 700;
            font-size: 15px;
            margin-bottom: 18px;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 18px;
        }

        .stat-box {
            border: 1px solid #2d703a;
            border-radius: 12px;
            padding: 10px 4px;
            background: rgba(0, 0, 0, 0.25);
        }

        .stat-value {
            color: #ffffff;
            font-size: 18px;
            font-weight: 800;
        }

        .stat-label {
            color: #9ca3af;
            font-size: 10px;
            margin-top: 2px;
        }

        /* Features Section */
        .features-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 8px;
        }

        .feature-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .feature-icon {
            color: #ffffff;
            font-size: 18px;
        }

        .feature-text {
            color: #a7f3d0;
            font-size: 11px;
        }

        /* Golden Glow & Blinking Join Button */
        .btn-join {
            display: block;
            width: 100%;
            margin-top: 16px;
            padding: 14px 10px;
            background: linear-gradient(180deg, #7cfc00 0%, #32cd32 100%);
            color: #b30000;
            font-size: 17px;
            font-weight: 800;
            text-align: center;
            text-decoration: none;
            border-radius: 12px;
            transition: transform 0.2s;
            animation: goldenGlowBlink 1.5s infinite ease-in-out;
        }

        .btn-join:active {
            transform: scale(0.97);
        }

        @keyframes goldenGlowBlink {
            0% {
                box-shadow: 0 0 10px #ffd700, 0 0 20px #ffd700;
                opacity: 1;
            }
            50% {
                box-shadow: 0 0 25px #ffd700, 0 0 45px #ffae00, 0 0 60px #ffd700;
                opacity: 0.9;
                transform: scale(1.02);
            }
            100% {
                box-shadow: 0 0 10px #ffd700, 0 0 20px #ffd700;
                opacity: 1;
            }
        }

        /* Footer */
        .footer {
            margin-top: 20px;
            text-align: center;
            color: #9ca3af;
            font-size: 12px;
            line-height: 1.5;
        }

        /* Stylish Ads Setup Credit */
        .ads-credit {
            margin-top: 10px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.07);
            padding: 6px 14px;
            border-radius: 30px;
            border: 1px solid rgba(255, 215, 0, 0.25);
            backdrop-filter: blur(5px);
        }

        .ads-label {
            color: #d1d5db;
            font-size: 11px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .ads-link {
            background: linear-gradient(135deg, #ffd700, #ffae00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            font-size: 12px;
            text-decoration: none;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }

        .ads-link:hover {
            filter: drop-shadow(0 0 6px rgba(255, 215, 0, 0.8));
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="card">
            <!-- Profile Picture -->
            <div class="profile-container">
               <img src="https://i.postimg.cc/7PjfqLfr/IMG-20260910-173512-977.jpg" alt="Ishita Tips" class="profile-img">
            </div>

            <!-- Title & Info -->
            <h1 class="brand-name">DUBAI JACKPOT KING</h1>
            <p class="subtitle">Real-Time Toss • Live Coverage • Instant Predictions</p>
            <p class="active-members">55K+ Active Members</p>

            <!-- Stats Box -->
            <div class="stats-grid">
                <div class="stat-box">

                </div>
                <div class="stat-box">

                    <div class="stat-label">Win Rate</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value">4.9★</div>

                </div>
            </div>

            <!-- Trust Features -->
            <div class="features-grid">
                <div class="feature-item">
                    <i class="fa-regular fa-circle-check feature-icon"></i>
                    <span class="feature-text">Verified</span>
                </div>
                <div class="feature-item">
                    <i class="fa-solid fa-lock feature-icon"></i>

                </div>
                <div class="feature-item">
                    <i class="fa-solid fa-chart-line feature-icon"></i>
                    <span class="feature-text">Profitable</span>
                </div>
                <div class="feature-item">
                    <i class="fa-regular fa-star feature-icon"></i>
                    <span class="feature-text">Top Rated</span>
                </div>
            </div>
        </div>

        <!-- Call to Action Button with Golden Glow & Blink -->
        <a href="https://t.me/+OCopxvflz4gxYjQ1" class="btn-join">
            🚀 Join Free Telegram Channel
        </a>

        <!-- Footer -->
        <div class="footer">
            © 2020-26 DUBAI JACKPOT KING<br>
            Professional Cricket Analysis<br>
            
            <!-- Credit Section -->
            <div class="ads-credit">
                <span class="ads-label">⚡ Ads Setup by</span>
                <a href="https://t.me/sahab164" target="_blank" rel="noopener noreferrer" class="ads-link">Babu Sahab</a>
            </div>
        </div>
    </div>

</body>
</html>
